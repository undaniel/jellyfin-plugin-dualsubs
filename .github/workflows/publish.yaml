name: '🚀 Publish Plugin'

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Build and package plugin
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          python3 -m venv .venv
          .venv/bin/pip install --quiet jprm
          mkdir -p artifacts
          .venv/bin/jprm plugin build . -o artifacts -v "$VERSION" --dotnet-framework net10.0

      - name: Generate repository manifest
        run: |
          set -euo pipefail
          ZIP=$(ls artifacts/*.zip)
          mkdir -p repo
          .venv/bin/jprm repo init repo
          .venv/bin/jprm repo add \
            -U "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$ZIP")" \
            repo "$ZIP"

      - name: Attach zip and manifest to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$GITHUB_REF_NAME" artifacts/*.zip repo/manifest.json --clobber
