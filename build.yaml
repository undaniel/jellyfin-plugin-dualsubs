version: "1.0.4.0"
targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Dual-language subtitles generated on the server for language learning"
description: >
  Combines two existing text subtitle tracks into a new ASS track: the learned language
  at the bottom and the native language above it. Works in every Jellyfin client because
  the result is a normal external subtitle. Bitmap subtitles are skipped.
category: "Subtitles"
owner: "Daniel Carrasco"
imageUrl: "https://raw.githubusercontent.com/undaniel/jellyfin-plugin-dualsubs/main/images/icon.png"
artifacts:
- "Jellyfin.Plugin.DualSubs.dll"
changelog: >
  Fixes the wrong-language track picked after a generated file was added. Jellyfin caches
  extracted embedded subtitles by stream index; adding an external file shifts those
  indexes. The plugin now detects that mismatch, clears the cache for the item and rebuilds
  the track, so items already broken by 1.0.0/1.0.1 heal on the next run. Generated files
  are also deleted by path, never by stream index.
