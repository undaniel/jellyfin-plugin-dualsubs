framework: "net10.0"
overview: "Dual-language subtitles generated on the server for language learning"
description: >
  Combines two existing text subtitle tracks into a new ASS track: the learned language
  at the bottom and the native language above it. Works in every Jellyfin client because
  the result is a normal external subtitle. Bitmap subtitles are skipped.
category: "Subtitles"
owner: "Daniel Carrasco"
imageUrl: "https://raw.githubusercontent.com/undaniel/jellyfin-plugin-dualsubs/main/images/icon.png"
artifacts:
- "Jellyfin.Plugin.DualSubs.dll"
changelog: >
  Language pairs are picked from a list of Jellyfin's languages instead of typing ISO
  codes, and removing a pair deletes its generated tracks on the next run.
